services:
  stub:
    image: ${STUB_IMAGE:-mockingbird-stub:local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"   # Stub traffic (clients call this) — used when STUB_PROTOCOL is HTTP or BOTH
      - "8081:8081"   # Actuator / Prometheus metrics
      - "443:443"     # TLS stub traffic — only listening when STUB_PROTOCOL is HTTPS or BOTH
    environment:
      STUB_PROJECT_ID: ${STUB_PROJECT_ID:-local-test}
      STUB_PROJECT_NAME: ${STUB_PROJECT_NAME:-Local Test Stub}
      STUB_ENVIRONMENT: ${STUB_ENVIRONMENT:-local}
      # HTTPS/mTLS (see docs/STUB_HTTPS_MTLS_DESIGN.md). Defaults below match
      # THIS stub's actual configured protocol/mTLS setting — override with a
      # shell env var (e.g. STUB_PROTOCOL=HTTP docker compose up) if you want
      # to run it differently than it was configured. entrypoint.sh
      # auto-generates a self-signed cert on first start when
      # TLS_CERT_SOURCE=AUTO_GENERATED.
      STUB_PROTOCOL: ${STUB_PROTOCOL:-{{STUB_PROTOCOL}}}
      MTLS_ENABLED: ${MTLS_ENABLED:-{{MTLS_ENABLED}}}
      TLS_CERT_SOURCE: ${TLS_CERT_SOURCE:-AUTO_GENERATED}
      JAVA_OPTS: >-
        -Xmx4g
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=10
        -XX:+UseStringDeduplication
      # Vault disabled for local development (stubs loaded from JAR resources)
      VAULT_ENABLED: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
