# Auto-generated by Mockingbird — TLS termination in front of the WireMock
# stub engine, which keeps listening on loopback :8080 completely unchanged.
# Regenerate the project (don't hand-edit this file) if the project's
# protocol/mTLS setting changes.
#
# Tuned for high connection-establishment rates (NFT-grade traffic), not
# just steady-state throughput: TLS session reuse (cache + upstream
# keepalive) avoids paying a full handshake on every request, which is
# where naive TLS termination loses the most throughput at 10K+ TPS.

worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 10000;
    reset_timedout_connection on;

    # Buffered access log — full request logging without a syscall per request.
    access_log /var/log/nginx/access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/error.log warn;

    # TLS session reuse — avoids a full handshake on every new connection.
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # Keepalive pool to WireMock on loopback — reuses connections instead of
    # a new TCP handshake per proxied request.
    upstream stub_backend {
        server 127.0.0.1:8080;
        keepalive 256;
    }

    server {
        listen 443 ssl http2 reuseport;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt.pem;
        ssl_certificate_key /etc/nginx/certs/server.key.pem;
{{MTLS_SERVER_DIRECTIVES}}

        client_max_body_size 20m;

        location / {
            proxy_pass http://stub_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
{{MTLS_PROXY_HEADERS}}
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
